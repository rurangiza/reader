version: '3'

tasks:
  default:
    cmds:
      - task --list-all
    silent: true
  compose:up:
    cmds:
      - docker compose up -d
  compose:down:
    cmds:
      - docker compose down
  compose:logs:
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}
  
  uncommit:
    cmds:
      - git reset --soft HEAD~1

  workflow:pr:
    cmds:
      - act pull_request --container-architecture linux/amd64 {{.CLI_ARGS}}
