version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  compose:up:
    cmds:
      - docker compose up -d
      - docker compose logs -f
  compose:down:
    cmds:
      - docker compose down
  compose:logs:
    cmds:
      - docker compose logs -f
  
  uncommit:
    cmds:
      - git reset --soft HEAD~1

  act:pr:
    # simulate a PR to test Github workflows
    cmds:
      - act pull_request --container-architecture linux/amd64
