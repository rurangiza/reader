version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true
  compose:up:
    cmds:
      - docker compose up -d
      - docker compose logs -f
  compose:down:
    cmds:
      - docker compose down
  compose:logs:
    cmds:
      - docker compose logs -f
  act:pr:
    # simulate a PR to test Github workflows
    cmds:
      - act pull_request
