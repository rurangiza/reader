name: ci

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: detect_changes
    runs-on: ubuntu-latest
    outputs:
      api_changes: ${{ steps.filter.outputs.api_changes }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api_changes:
              - 'apps/api/**'
              - 'packages/database/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yaml'

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup package manager (pnpm)
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run linter
        run: pnpm turbo run lint --filter=...[origin/main]

  checktypes:
    name: check_types
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
      - name: Setup package manager (pnpm)
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run type checker
        run: pnpm turbo run check-types --filter=...[origin/main]
  
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.api_changes == 'true'

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup package manager (pnpm)
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run Unit Tests
        run: pnpm turbo run test:unit --filter=...[origin/main]

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    container: node:20-bookworm-slim
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.api_changes == 'true'

    services:
      reader_db:
        image: postgres:alpine3.23
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: reader_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup package manager (pnpm)
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Initialize the database
        working-directory: ./packages/database
        env:
          DATABASE_URL: postgresql://postgres:password@reader_db
        run: |
          apt-get update -y && apt-get install -y openssl
          pnpm db:init
          pnpm db:generate
      - name: Run E2E Tests
        env:
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql://postgres:password@reader_db
        run: pnpm test:e2e
