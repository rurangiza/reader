name: ci

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup package manager (pnpm)
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - run: pnpm turbo run lint --filter=...[origin/main]

  checktypes:
    name: check_types
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
      - name: Setup package manager (pnpm)
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run type checks
        run: pnpm turbo run check-types --filter=...[origin/main]
  
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup package manager (pnpm)
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run automated tests (API only)
        run: pnpm turbo run test:api
